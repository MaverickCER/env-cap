name: Feature request
description: Propose new behavior, an API addition, or a new build-time capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the concrete situation, not just the desired API. env-cap's design intentionally rejects some conveniences (see specs/decisions/) when they'd require executing discovered schema files or introducing a global env object — knowing the underlying problem helps find a solution consistent with those constraints.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Sketch the call site you'd want to write, or the CLI flag/option shape.
      render: ts

  - type: dropdown
    id: stability
    attributes:
      label: Would this be a change to a stable surface, or could it ship Experimental first?
      description: See VERSIONING.md. A new build-time option (like `packages`, the cross-package discovery allowlist) is a reasonable candidate for shipping Experimental before being locked to strict semver.
      options:
        - "Not sure"
        - "Should be stable from day one"
        - "Fine shipping Experimental first"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've already considered
      description: Existing helpers/processors/validators, a userland workaround, or a similar feature in another tool (dotenv, zod, envalid, t3-env) — helps avoid re-litigating an already-rejected approach from specs/decisions/.
