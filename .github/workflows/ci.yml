name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a bot-authored branch with no human push get real CI on demand --
  # internal-package-contract's dependency-pin-sync.yml (called from this
  # repo's own sync-internal-package-contract.yml) dispatches this explicitly
  # after opening its pin-bump PR. (This is NOT needed for the benchmark-pr
  # job's own commit below -- that one genuinely fires its own `pull_request:
  # synchronize` event, contrary to what an earlier version of this comment
  # assumed; see benchmark-pr's own placement/ordering for how that's
  # actually handled now.)
  workflow_dispatch:

# Explicit least-privilege default so every job's GITHUB_TOKEN scope is a
# property of this file, not an assumption about the repo/org's ambient
# default. Jobs that need more (`deploy` below) override this at the job
# level -- a job-level `permissions:` block replaces, not adds to, this one.
permissions:
  contents: read

# Runtime and helpers each carry a hard 3 KB gzip budget (scripts/check-size.mjs) --
# this workflow is what turns that budget from a script someone could forget
# to run into a check every change actually has to pass.
jobs:
  # Runs first, on every PR, and -- when the PR's own diff touches benchmarked
  # code -- commits refreshed results straight onto the PR branch. Every
  # other job in this workflow now `needs` this one and checks out the PR
  # branch's own live head rather than the originally-triggered SHA, so
  # whatever this job just committed is exactly what `lint`/`contract`/etc.
  # actually validate -- one real commit, one real CI pass, not two. This
  # used to be a separate `benchmarks.yml` workflow running in parallel with
  # this one, with a `carry-forward-required-checks.sh` step trying to copy
  # this workflow's own results onto the benchmark commit after the fact --
  # that design assumed a `GITHUB_TOKEN`-authored push never fires its own
  # `pull_request: synchronize` (an anti-recursion guard GitHub documents),
  # but in practice it does, which meant every benchmark commit re-triggered
  # a brand-new, separately-gated CI run on top of the carry-forward attempt
  # -- a loop that could re-trigger indefinitely on real benchmark-timing
  # noise between runs. Sequencing it first here, in the same workflow,
  # removes the race (and the carry-forward script) entirely: there's only
  # ever one workflow run per real push, and it validates the state that
  # actually gets merged.
  #
  # As of internal-package-contract's "shared benchmark engine" (PR #22),
  # this job's own steps (measure -> post/update the PR comment ->
  # conditionally commit results+history) are no longer maintained here --
  # they live once, for both env-cap and data-cap, in
  # internal-package-contract's own reusable
  # `.github/workflows/benchmark-pr.yml`, called below via `uses:`. This job
  # still MUST keep the exact name `benchmark-pr`: `lint`/`verify` below (and
  # `contract`/`badges`/`deploy` transitively, via their own identically-
  # shaped conditions) all read `needs.benchmark-pr.result` by that exact
  # job name.
  #
  # The anti-recursion-loop guard (`github.actor != 'github-actions[bot]'`,
  # same-repo PRs only) and the per-PR concurrency group that used to live
  # inline here now live INSIDE that reusable workflow's own job (see its
  # own header comment in internal-package-contract) -- deliberately not
  # duplicated here. `github.event_name`/`github.event`/`github.actor`
  # inside a called reusable workflow are the CALLING workflow's own values,
  # not the reusable workflow's -- GitHub documents this context propagation,
  # so that condition evaluates exactly as it did when it lived inline in
  # this file. When it evaluates false (a push-to-main run, a fork PR, or
  # the bot's own re-triggered run), the reusable workflow's one job is
  # skipped, and GitHub reports THIS calling job's own `result` as `skipped`
  # too -- confirmed live (see this migration's own PR description for the
  # exact run checked) -- exactly like the plain `if:`-skipped job this
  # replaced. `lint`/`verify` below already tolerate that (see their own
  # `if:`), unchanged.
  benchmark-pr:
    # Matches what the job's own steps need when they actually run (write a
    # commit, push it, read/post/update a PR comment) -- required here
    # because permissions for a called reusable workflow's GITHUB_TOKEN can
    # only be reduced, never elevated, relative to what the CALLING job
    # grants; this workflow's default `permissions: contents: read` above
    # would otherwise cap the reusable workflow down to read-only.
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # The `suites`/`install-dirs` inputs below exist only in internal-package-contract commits that
    # include the generalized benchmark kit: bump this SHA to such a commit together with the
    # internal-package-contract devDependency pin, in the same pull request.
    uses: MaverickCER/internal-package-contract/.github/workflows/benchmark-pr.yml@8e8f6809fd77b44b6946d93c1df11e011f363680 # main, shared benchmark engine (PR #22)
    with:
      suites: |
        Runtime|benchmarks/performance-runtime|benchmarks/history/runtime.json
        Build-time|benchmarks/performance-buildtime|benchmarks/history/buildtime.json
      install-dirs: |
        benchmarks/performance-runtime
        benchmarks/performance-buildtime
      budgets-path: benchmarks/budgets.mjs
      comment-marker: "<!-- env-cap-benchmark-summary -->"
      node-version: 22.x

  # Dev-tooling checks (lint/format/API-report) are a property of the source
  # repo, not the published package's own runtime behavior across Node
  # versions -- unlike `verify` below, running them once on a single modern
  # Node version is correct, not a coverage gap. Splitting them out here
  # also keeps them independent of `verify`'s own Node-version floor.
  lint:
    needs: [benchmark-pr]
    # A skipped dependency isn't a passing one by GitHub's own default job
    # condition -- without this, `lint` (and `verify` below) would themselves
    # always skip whenever benchmark-pr does (every push-to-main run, every
    # fork PR), taking every job that needs them, including `contract`, down
    # with them. `always()` opts back into running on a skip; the explicit
    # result check still blocks on a genuine benchmark-pr failure.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # refs/pull/<N>/head, not the branch name -- resolves for a fork
          # PR too (whose branch lives in the fork, not this repo), and is
          # the PR's real head commit rather than a speculative merge with
          # main. Falls back to the pushed ref outside pull_request events.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The committed Markdown API report (docs/api-report/) must match a
      # fresh `typedoc --options typedoc.markdown.json` -- a public API
      # change can't land without the report, and the PR diff, updated too.
      - run: npm run docs:api:report:check

  # Matches package.json's own `engines.node` floor (`>=20.0.0`). Was
  # `[18.x, 22.x, 24.x]` until the dev toolchain itself (Vitest 4.x, whose
  # own `engines.node` is `^20.0.0 || ^22.0.0 || >=24.0.0`) stopped running
  # on Node 18 at all -- `vitest run --coverage` can't even start there,
  # so 18.x was never actually being verified, just failing to boot. The
  # `engines.node` promise moved to match what's genuinely tested.
  verify:
    needs: [benchmark-pr]
    # Same reasoning as `lint`'s own identical condition above.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size
      - run: npm run verify:no-ambient-fs
      - run: npm run verify:no-ambient-child-process

  verify-current:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.x
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size

  # The org-wide governance gate: internal-package-contract's own 27 checks
  # (mutation, coverage, security-deps/secrets/socket, accessibility,
  # dead-code, docs, licenses, ...) run against this package for real, not
  # just declared as a devDependency. Node 24.x to match
  # internal-package-contract's own engines.node floor.
  contract:
    needs: [verify, lint]
    # Same reasoning as `verify`/`lint`'s own identical-shaped condition: GitHub's default
    # `success()` considers the *entire* transitive dependency graph, not just this job's direct
    # `needs` -- since `verify`/`lint` themselves depend on `benchmark-pr`, a skipped `benchmark-pr`
    # (every push-to-main run, every fork PR) still propagates through as "not success" here even
    # when `verify`/`lint` genuinely ran and passed, silently skipping `contract` itself. Confirmed
    # live: a real PR run where `verify`/`lint` both concluded "success" still skipped `contract`.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the Commits check reads origin/main..HEAD.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci
      # internal-package-contract's own runner deletes reports/ and coverage/
      # after the run UNLESS they existed before it started -- pre-creating
      # them here is what makes the mutation-report artifact upload below
      # (and Coverage's own reports) survive past the run at all on a fresh
      # CI checkout, which starts with neither directory present.
      - run: mkdir -p reports coverage
      - run: npm run benchmark:check --if-present
      - run: npm run contract
        env:
          # SecuritySocket scores the package on Socket.dev and FAILS without a token. Create a
          # token at socket.dev (Settings > API Tokens, `packages:list`) and add it as the
          # repository or organization secret SOCKET_SECURITY_API_KEY.
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

      # Diagnostic aid, not part of the gate itself: `always()` so a failed
      # Mutation run's exact per-mutant detail (file, mutator, location,
      # status) is downloadable instead of only the summary count `npm run
      # contract` prints to the log -- needed to hand-verify a CI-only
      # "Survived" that never reproduces locally, per each mutant's own real
      # source rather than guessing from the count alone.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          retention-days: 5
          if-no-files-found: ignore

      # A contract run is not a pure read: Format/Lint auto-fix, and
      # SecurityDeps/SecuritySocket reconcile .repo-contract/exceptions/*.json
      # (scaffolding a blank stub for any new finding, surfacing a stale
      # record). CI starts from a clean checkout, so any post-run working-tree
      # change means an ungoverned finding or an un-added exception stub
      # slipped through -- fail loudly rather than let it ride along with a
      # green run, matching repo-contract's own identical guard.
      - name: Working tree is clean after the contract run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The contract run left the working tree dirty. A new finding needs its exception stub filled in and committed (.repo-contract/exceptions/), or a file needs formatting. Run 'npm run contract' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun test test/cross-runtime/bun.test.ts

      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2
        with:
          deno-version: v2.x
      # --no-check: Deno's type-checker doesn't resolve the sibling .d.ts for
      # a bare relative-path .js import the way tsc/vitest do, and instead
      # infers a type from dist/index.js's own static JS shape -- a Deno
      # import-resolution nuance, not a defect in the shipped declarations
      # (see test/cross-runtime/deno.test.ts's header comment). This job's
      # job is proving execution conformance, which --no-check still fully
      # exercises; type-declaration correctness is already checked by
      # `npm run typecheck` against source in the `verify` job above.
      - run: deno test --no-check --allow-read test/cross-runtime/deno.test.ts

  # Proves the three flagship examples still install and generate cleanly
  # against the real, just-built package -- each depends on the root package
  # via `file:../..`, which needs `dist/` to already exist. Without this job,
  # an API change could silently break a flagship's env.schema.ts with
  # nothing to catch it until a human runs one by hand.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: application
        working-directory: examples/application
        run: |
          npm install
          npm run typecheck

      # README.md's "See it run" section claims to be real output from this
      # same example -- verify:readme-example (scripts/check-readme-example-fresh.mjs)
      # re-runs its doc-generation command and fails on drift (e.g. a stale
      # day count). Runs from the repo root, after `application`'s own
      # `npm install` above -- it skips gracefully everywhere examples/
      # application/node_modules isn't installed (see the script's own
      # header), so this is the one place it actually asserts anything.
      - run: npm run verify:readme-example

      - name: team-service
        working-directory: examples/team-service
        run: |
          npm install
          npm run typecheck

      - name: enterprise-platform
        working-directory: examples/enterprise-platform
        run: |
          npm install
          npm run typecheck
          npm run test:evidence
          npm start

      # Not a fourth flagship -- see examples/README.md's "Framework
      # integration" section. `npm run build` is the real assertion here: it
      # chains `docs` -> `scripts/validate-env.ts` (tsx) -> `next build`, so a
      # regression in the fail-fast contract mechanism (or the
      # serverExternalPackages/force-dynamic/per-chunk-import fixes this
      # example's own README documents) fails CI, not just a typecheck.
      - name: nextjs-app
        working-directory: examples/nextjs-app
        run: |
          npm install
          npm run build

      # Runs each flagship's real npm scripts against its own committed,
      # fake-but-plausible `.env` file and asserts on real stdout -- the
      # actual runtime path (validateEnv -> read a validated value), not just
      # that the schema typechecks -- then asserts its committed generated
      # output is exactly what a fresh run produces, via that example's own
      # `check` script (`env-cap --check`). No `expected/` mirror tree: the
      # committed docs/manifest/.env.example are themselves the golden.
      # One file per flagship -- see test/examples/support.ts.
      - run: npx vitest run test/examples/

  # Proves every relocated behavioral fixture (Part 0 of the examples
  # restructuring -- see examples/README.md) still installs and generates
  # cleanly against the real, just-built package. These are no longer
  # presented to human readers as examples (see examples/README.md), but
  # every scenario they prove still runs in CI exactly as it did before the
  # restructuring -- zero coverage loss, just de-emphasized.
  integration-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build

      # Same contract as application, generated via the packaged env-cap CLI
      # binary instead of a custom .mjs script -- proves the real bin entry
      # resolves and behaves as documented.
      - name: cli-usage
        working-directory: test/integration/positive/basic/cli-usage
        run: |
          npm install
          npm run typecheck

      # application's exact contract, generated via three separate standalone
      # calls (generateEnvManifest/generateDocumentation/generateUsageReport)
      # instead of one generateEnvArtifacts() call.
      - name: split-generators
        working-directory: test/integration/positive/basic/split-generators
        run: |
          npm install
          npm run typecheck

      # One schema/manifest, validated by two separate entry points
      # (example:server/example:client) with different activeContexts --
      # see ADR 0022.
      - name: validation-contexts
        working-directory: test/integration/positive/team/validation-contexts
        run: |
          npm install
          npm run typecheck

      # Not broken -- two independently-owned, both-active contracts document
      # the same variable name differently, always a warning (never an
      # error) by default.
      - name: duplicate-variable-metadata
        working-directory: test/integration/positive/team/duplicate-variable-metadata
        run: |
          npm install
          npm run typecheck

      # No AWS credentials are configured in this job on purpose: a failed
      # DescribeSecretCommand call is caught per-variable and falls back to
      # the static expiresAt (see live-expirations.ts) -- generate:env, and
      # therefore typecheck, is designed to still succeed without them.
      - name: aws-secrets-manager
        working-directory: test/integration/positive/enterprise/aws-secrets-manager
        run: |
          npm install
          npm run typecheck

      # paypal-consumer installs paypal-addon from a real packed tarball, not
      # a workspace/symlink reference (see both fixtures' package.json
      # descriptions for why) -- paypal-addon must be built and packed before
      # paypal-consumer installs.
      - name: paypal-addon (typecheck, build, pack)
        working-directory: test/integration/positive/enterprise/paypal-addon
        run: |
          npm install
          npm run typecheck
          npm run pack:local

      - name: paypal-consumer (installs paypal-addon's packed tarball)
        working-directory: test/integration/positive/enterprise/paypal-consumer
        run: |
          npm install
          npm run typecheck

      # A contract imported only through a "@/*" tsconfig.json path alias,
      # never a relative import, resolved automatically (no `tsconfig` option
      # passed) by both env-cap's static analysis and tsx at runtime -- see
      # ADR 0023. Also installable as its own package (like paypal-addon) --
      # built and packed here so tsconfig-aliases-consumer below can install
      # it from a real tarball.
      - name: tsconfig-aliases (typecheck, build, pack)
        working-directory: test/integration/positive/enterprise/tsconfig-aliases
        run: |
          npm install
          npm run typecheck
          npm run pack:local

      # Installs tsconfig-aliases's packed tarball and discovers its contract
      # via `packages` (ADR 0014), while this app's own local contract is
      # organized through its own "@/*" alias (ADR 0023) -- proves the two
      # mechanisms compose in one real install.
      - name: tsconfig-aliases-consumer (installs tsconfig-aliases's packed tarball)
        working-directory: test/integration/positive/enterprise/tsconfig-aliases-consumer
        run: |
          npm install
          npm run typecheck

      # env-cap's own first-party Evidence Model projections -- the original
      # ten (ADR 0024/0031/0032) plus an eleventh, Joined Variable View,
      # added afterward -- built entirely through the public API
      # (generateEvidenceModel() from /build, defineEvidenceProjection()
      # from /evidence) -- reuses application's exact schema so each
      # projection's output can be golden-compared against the existing,
      # already-tested rendering path.
      - name: evidence-projections
        working-directory: test/integration/positive/enterprise/evidence-projections
        run: |
          npm install
          npm run typecheck

      # Deliberately, permanently broken by design -- a missing required
      # variable. `typecheck` succeeds here (static discovery never reads
      # .env values); only `start`, which actually calls validateEnv(), is
      # expected to fail.
      - name: missing-env-var
        working-directory: test/integration/negative/invalid-config/missing-env-var
        run: |
          npm install
          npm run typecheck

      # Deliberately, permanently broken by design -- two active contracts
      # sharing an exclusiveGroup. `generate:env` (and therefore
      # `typecheck`/`start`, which both run it first) always fails here, so
      # -- unlike every other fixture in this job -- there is no typecheck
      # step: it would never get past generation to reach `tsc` anyway.
      - name: multiple-active-exclusive-capabilities
        working-directory: test/integration/negative/exclusive-violation/multiple-active-exclusive-capabilities
        run: npm install

      # Runs each fixture's real npm scripts against its own committed,
      # fake-but-plausible `.env` file and asserts on real stdout, and
      # golden-compares every generated artifact byte-for-byte against its
      # committed expected/ copy. One file per fixture, mirroring
      # test/integration/{positive,negative}/ 1:1 -- see
      # test/support/example-runner.ts.
      - run: npx vitest run test/integration/positive/ test/integration/negative/

  # Coverage/bundle-size badges (item B) -- only on a push to main, never on a
  # PR run (a job whose `if` is false is skipped, and everything downstream
  # via `needs:` is skipped with it, so `deploy` below never runs for a PR).
  # Deliberately depends on `verify` and `cross-runtime`, NOT `verify-current`
  # (the Node-"current" signal job), since that job is intentionally
  # `continue-on-error: true` and non-blocking -- gating the docs deploy on it
  # would contradict its own documented purpose.
  badges:
    needs: [verify, lint, cross-runtime]
    # Same transitive-skip reasoning as `contract`'s own identical-shaped condition above --
    # `verify`/`lint` depend on `benchmark-pr`, which is always skipped on a push-to-main event
    # (it only ever runs for `pull_request`), so without this, GitHub's default `success()` here
    # sees that skipped ancestor and silently skips `badges` (and therefore `deploy` below) even
    # when `verify`/`lint` genuinely ran and passed. Confirmed live on a real push to `main`.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.cross-runtime.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size -- --json coverage/size-summary.json
      - name: Generate badge data
        run: node scripts/generate-badges.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-badges
          path: |
            docs/coverage-badge.json
            docs/size-badge.json
          retention-days: 14

  # Deploys docs/ (the GitHub Pages site) plus the badge JSON `badges` above
  # just produced, in the same run -- no cross-run artifact download, no
  # extra `actions: read` permission, no second workflow file to keep in
  # sync with this one. Only this job needs the `pages`/`id-token`
  # permissions and the `pages` concurrency group -- job-level `permissions`/
  # `concurrency` override the workflow-level default, so `verify`/
  # `verify-current`/`cross-runtime`/`badges` keep running with the
  # workflow's existing minimal default permissions.
  deploy:
    needs: badges
    # Same transitive-skip reasoning as `badges`'/`contract`'s own conditions above -- `badges`'
    # own ancestry runs back through `verify`/`lint` to `benchmark-pr`, which is always skipped on
    # a push-to-main event, so without this, GitHub's default `success()` here still sees that
    # skipped ancestor deep in the chain and silently skips `deploy` even when `badges` genuinely
    # ran and passed. Confirmed live on a real push to `main`.
    if: always() && needs.badges.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify site entry point exists
        run: test -f docs/index.html
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      # The rendered HTML API reference is generated fresh here, never
      # committed -- it lands at maverickcer.github.io/env-cap/api/ alongside
      # the hand-authored landing page. The Markdown report drift check in
      # the `verify` job is what guards the API surface itself.
      - run: npm run docs:api
      # Same "generated fresh here, never committed" treatment as docs:api
      # above -- internal-package-contract's shared benchmark engine builds
      # the history chart page from the committed benchmarks/history/*.json
      # files (see benchmark-pr's own header comment above for where those
      # come from). Lands at maverickcer.github.io/env-cap/benchmarks/.
      - run: >-
          node node_modules/internal-package-contract/scripts/benchmark/render-page.mjs
          --out docs/benchmarks/index.html
          --readme https://github.com/maverickcer/env-cap/blob/main/benchmarks/README.md
          --history 'Runtime|benchmarks/history/runtime.json'
          --history 'Build-time|benchmarks/history/buildtime.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-badges
          path: docs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
