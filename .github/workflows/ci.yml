name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The pin-sync workflow dispatches CI on its bot-authored pull request, which no push event triggers.
  workflow_dispatch:

# Least privilege by default, so each job's token scope is visible here. A job-level `permissions:` block
# replaces this one, so `deploy` grants its own.
permissions:
  contents: read

# The size budgets live in ci/size-budgets.mjs, and every change must pass them here.
jobs:
  # Posts benchmark results as one PR comment and never commits, so every job below tests the pushed
  # commit. Keep the job id: the jobs below read `needs.benchmark-pr.result` by name.
  benchmark-pr:
    # A caller job's own `permissions:` caps the token the reusable workflow's job runs with, so it
    # must grant at least what that job declares. The pinned benchmark-pr.yml only reads the
    # repository and posts or updates the PR comment (`contents: read`, `pull-requests: write`);
    # it never commits or pushes to the PR branch.
    permissions:
      contents: read
      pull-requests: write
    # Bump this SHA together with the internal-package-contract devDependency pin, in one pull request,
    # because the `suites` and `install-dirs` inputs must exist at the pinned commit.
    uses: MaverickCER/internal-package-contract/.github/workflows/benchmark-pr.yml@06350a159d3a1e68beea70a035421492f0203f3c # v0.20.0
    with:
      suites: |
        Runtime|benchmarks/performance-runtime|benchmarks/history/runtime.json
        Build-time|benchmarks/performance-buildtime|benchmarks/history/buildtime.json
      install-dirs: |
        benchmarks/performance-runtime
        benchmarks/performance-buildtime
      budgets-path: benchmarks/budgets.mjs
      comment-marker: "<!-- env-cap-benchmark-summary -->"
      node-version: 22.x

  # Lint, format and the API report depend on the source, not on the Node version, so one modern Node is
  # enough.
  lint:
    needs: [benchmark-pr]
    # A skipped benchmark-pr (every push to main, every fork PR) must not skip this job, so
    # `always()` opts back in on a skip. A failed benchmark-pr skips it. GitHub counts a skipped
    # required check as passing, so `contract` fails on that failure in its first step.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is the merge commit for a pull_request, the pushed commit for a push, and the
          # branch head for a workflow_dispatch. Never check out the PR head by name: in a workflow that
          # can be dispatched, that runs untrusted code with a privileged cache scope (CodeQL
          # actions/cache-poisoning).
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The committed Markdown API report (docs/api-report/) must match a fresh build, so a public API
      # change shows in the pull request diff.
      - run: npm run docs:api:report:check

  # The matrix starts at package.json's `engines.node` floor (`>=22.0.0`), so the floor is tested.
  verify:
    needs: [benchmark-pr]
    # Same reasoning as `lint`'s own identical condition above.
    if: always() && (needs.benchmark-pr.result == 'success' || needs.benchmark-pr.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size
      - run: npx --no-install internal-package-contract tool ambient
      - run: npm run verify:compiler-isolation

  verify-current:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run size

  # Runs internal-package-contract's checks (mutation, coverage, security, docs, licences and more) on
  # this package. Node 24.x matches internal-package-contract's `engines.node` floor.
  contract:
    needs: [verify, lint, benchmark-pr]
    # Always runs, so it can never be skipped: GitHub counts a skipped required check as passing.
    # The first step fails it when benchmark-pr failed or verify or lint did not pass. A benchmark
    # failure then blocks the merge through both `contract` and `required`.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CodeScanning reads the repository's open alerts.
      security-events: read
    steps:
      - name: benchmark-pr, verify and lint passed
        if: needs.verify.result != 'success' || needs.lint.result != 'success' || (needs.benchmark-pr.result != 'success' && needs.benchmark-pr.result != 'skipped')
        env:
          BENCHMARK: ${{ needs.benchmark-pr.result }}
          VERIFY: ${{ needs.verify.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          echo "::error::contract needs benchmark-pr to pass or be skipped, and verify and lint to pass (benchmark-pr=$BENCHMARK, verify=$VERIFY, lint=$LINT)"
          exit 1

      # fetch-depth: 0; the Commits check reads origin/main..HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - run: npm ci
      # IPC's runner deletes reports/ and coverage/ after the run unless they existed before it. Creating
      # them first keeps the mutation report for the upload below.
      - run: mkdir -p reports coverage
      - run: npm run benchmark:check --if-present
      - run: npm run contract
        env:
          # SecuritySocket scores the package on Socket.dev and FAILS without a token. Create a
          # token at socket.dev (Settings > API Tokens, `packages:list`) and add it as the
          # repository or organization secret SOCKET_SECURITY_API_KEY.
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_TOKEN: ${{ github.token }}

      # Diagnostic only. `always()` keeps the per-mutant detail of a failed Mutation run downloadable, so
      # a CI-only survivor can be checked against its source.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          retention-days: 5
          if-no-files-found: ignore

      # A contract run can write: Format and Lint auto-fix, and SecurityDeps and SecuritySocket add
      # exception stubs. Any change after the run on a clean checkout is an ungoverned finding, so it
      # fails.
      - name: Working tree is clean after the contract run
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The contract run left the working tree dirty. A new finding needs its exception stub filled in and committed (.repo-contract/exceptions/), or a file needs formatting. Run 'npm run contract' locally and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

  # The package declares `typescript: ^5 || ^6 || ^7` as a peer and the development toolchain is on 6, so the
  # type-check and the tests also run against the newest TypeScript 5. The oldest declared floor is not
  # covered here.
  typescript-5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm install --no-save typescript@5
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # Packs the package and installs it next to a root `typescript` of 5, 6 and 7. The scanner must run from
  # its ESM and CJS entry points (under 7 through the bundled TypeScript 6, ADR 0049). The shipped
  # declarations must type-check in a consumer. See scripts/typescript-compat.mjs.
  typescript-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm run build
      - run: npm run typescript-compat

  cross-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm run build

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun test test/cross-runtime/bun.test.ts

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      # --no-check: Deno does not resolve the sibling .d.ts for a relative .js import (see
      # test/cross-runtime/deno.test.ts). This job proves execution; `verify` type-checks the
      # declarations.
      - run: deno test --no-check --allow-read test/cross-runtime/deno.test.ts

  # Each flagship example installs the built package via `file:../..`, so an API change that breaks one
  # fails here instead of on a reader's machine.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm run build

      - name: application
        working-directory: examples/application
        run: |
          npm ci
          npm run typecheck

      # README.md's "See it run" output must match a fresh run of this example. The script skips where
      # examples/application/node_modules is missing, so this step is its only real assertion.
      - run: npm run verify:readme-example

      - name: team-service
        working-directory: examples/team-service
        run: |
          npm ci
          npm run typecheck

      - name: enterprise-platform
        working-directory: examples/enterprise-platform
        run: |
          npm ci
          npm run typecheck
          npm run test:evidence
          npm start

      # `npm run build` chains `docs`, `scripts/validate-env.ts` and `next build`. A regression in the
      # fail-fast check or the fixes this example's README documents fails CI.
      - name: nextjs-app
        working-directory: examples/nextjs-app
        run: |
          npm ci
          npm run build

      # Runs each flagship's npm scripts against its committed `.env` and asserts on stdout. Its `check`
      # script (`env-cap --check`) then compares the committed generated files with a fresh run.
      - run: npx vitest run test/examples/

  # Each behavioural fixture under test/integration/ must install and generate against the built package,
  # because each one proves a scenario no unit test reaches.
  integration-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - run: npm ci
      - run: npm run build

      # Same contract as application, generated by the packaged `env-cap` binary, so the bin entry is
      # exercised.
      - name: cli-usage
        working-directory: test/integration/positive/basic/cli-usage
        run: |
          npm ci
          npm run typecheck

      # application's contract, generated by three standalone calls instead of one
      # `generateEnvArtifacts()` call.
      - name: split-generators
        working-directory: test/integration/positive/basic/split-generators
        run: |
          npm ci
          npm run typecheck

      # One manifest, validated by two entry points with different activeContexts (ADR 0022).
      - name: validation-contexts
        working-directory: test/integration/positive/team/validation-contexts
        run: |
          npm ci
          npm run typecheck

      # Not broken: two active contracts document one variable differently, which is a warning by default.
      - name: duplicate-variable-metadata
        working-directory: test/integration/positive/team/duplicate-variable-metadata
        run: |
          npm ci
          npm run typecheck

      # No AWS credentials on purpose. A failed DescribeSecretCommand falls back to the static expiresAt
      # (live-expirations.ts), so `generate:env` still succeeds.
      - name: aws-secrets-manager
        working-directory: test/integration/positive/enterprise/aws-secrets-manager
        run: |
          npm ci
          npm run typecheck

      # paypal-consumer installs paypal-addon from a packed tarball, not a workspace link, so paypal-addon
      # is built and packed first.
      - name: paypal-addon (typecheck, build, pack)
        working-directory: test/integration/positive/enterprise/paypal-addon
        run: |
          npm ci
          npm run typecheck
          npm run pack:local

      - name: paypal-consumer (installs paypal-addon's packed tarball)
        working-directory: test/integration/positive/enterprise/paypal-consumer
        run: |
          npm ci
          npm run typecheck

      # A contract reached only through a `@/*` tsconfig path alias, resolved with no `tsconfig` option
      # (ADR 0023). It is packed here for tsconfig-aliases-consumer.
      - name: tsconfig-aliases (typecheck, build, pack)
        working-directory: test/integration/positive/enterprise/tsconfig-aliases
        run: |
          npm ci
          npm run typecheck
          npm run pack:local

      # Installs tsconfig-aliases from its tarball through `packages` (ADR 0014) and uses its own `@/*`
      # alias (ADR 0023). This proves the two compose in one install.
      - name: tsconfig-aliases-consumer (installs tsconfig-aliases's packed tarball)
        working-directory: test/integration/positive/enterprise/tsconfig-aliases-consumer
        run: |
          npm ci
          npm run typecheck

      # env-cap's first-party Evidence Model projections, built only through the public API. They reuse
      # application's schema, so each output is compared with the tested rendering path.
      - name: evidence-projections
        working-directory: test/integration/positive/enterprise/evidence-projections
        run: |
          npm ci
          npm run typecheck

      # Broken by design: a required variable is missing. `typecheck` passes because discovery never reads
      # `.env`; only `start` fails.
      - name: missing-env-var
        working-directory: test/integration/negative/invalid-config/missing-env-var
        run: |
          npm ci
          npm run typecheck

      # Broken by design: two active contracts share an exclusiveGroup, so `generate:env` always fails.
      # `typecheck` and `start` run that generation first, so this fixture, unlike the others, has no
      # typecheck step.
      - name: multiple-active-exclusive-capabilities
        working-directory: test/integration/negative/exclusive-violation/multiple-active-exclusive-capabilities
        run: npm ci

      # Runs each fixture's npm scripts against its committed `.env` and compares every generated file
      # byte for byte with its `expected/` copy (test/support/example-runner.ts).
      - run: npx vitest run test/integration/positive/ test/integration/negative/

  # The ruleset requires this job. It fails unless every job in `needs` succeeded, because GitHub cannot
  # require a matrix job by name and counts a skipped job as passing. `benchmark-pr` may skip; it runs only
  # on same-repo pull requests. `verify-current` stays informational. test/ci-jobs.test.ts fails when a new
  # job is missing from `needs`.
  required:
    needs:
      - benchmark-pr
      - lint
      - verify
      - contract
      - typescript-5
      - typescript-compat
      - cross-runtime
      - examples
      - integration-fixtures
      - package-managers
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Every gate job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: >-
          node -e "const needs = JSON.parse(process.env.NEEDS);
          const maySkip = new Set(['benchmark-pr']);
          const bad = Object.entries(needs).filter(([id, n]) => !(n.result === 'success' || (maySkip.has(id) && n.result === 'skipped')));
          if (bad.length > 0) {
            console.error('::error::not green: ' + bad.map(([id, n]) => id + '=' + n.result).join(', '));
            process.exit(1);
          }"

  # Installs the packed tarball with npm, pnpm, Yarn 1 and Yarn Berry (node-modules linker) and imports
  # every entry as ESM and CommonJS. That is all it proves. Yarn Plug'n'Play and non-hoisted pnpm are
  # unsupported.
  package-managers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - run: npm run package-managers

  # Coverage and size badges are built only on a push to main; skipping here also skips `deploy` on a
  # pull request. It does not need `verify-current`, which may fail by design.
  badges:
    needs: [verify, lint, cross-runtime, contract]
    # `benchmark-pr` always skips on a push to main. GitHub's default `success()` would then skip
    # `badges` and `deploy` even when `verify` and `lint` passed, so `always()` opts back in.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && always() &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      needs.cross-runtime.result == 'success' &&
      needs.contract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run size -- --json coverage/size-summary.json
      # The mutation score comes from the report the `contract` job already paid for, not a second
      # mutation run. The badge writer is internal-package-contract's shared one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-report
          path: reports/mutation
      - name: Generate mutation badge data
        run: node node_modules/internal-package-contract/scripts/run-mutation-badge.mjs
      - name: Generate badge data
        run: npx --no-install internal-package-contract tool badges
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-badges
          path: |
            docs/coverage-badge.json
            docs/coverage.json
            docs/mutation-badge.json
            docs/mutation.json
            docs/size-badge.json
            docs/size.json
          retention-days: 14

  # Deploys docs/ and the badge JSON from `badges` in the same run, so no cross-run artifact download is
  # needed. Only this job gets the `pages` and `id-token` permissions.
  deploy:
    needs: badges
    # `always()` for the same reason as `badges`: a skipped `benchmark-pr` deep in the chain would
    # otherwise skip `deploy`.
    if: always() && needs.badges.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify site entry point exists
        run: test -f docs/index.html
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - run: npm ci
      # The HTML API reference is built here and never committed. The Markdown report check in `lint`
      # guards the API surface.
      - run: npm run docs:api
      # The benchmark history page is built here from the committed benchmarks/history/*.json and never
      # committed.
      - run: npm run docs:benchmarks
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-badges
          path: docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
