name: "env-cap report"
description: "Runs env-cap and turns the result into PR annotations and a summary comment."
inputs:
  args:
    description: "Arguments passed to `env-cap --json`, e.g. '--docs docs/ENVIRONMENT.md --ownership docs/OWNERSHIP.md --strict-docs --evidence docs/env.evidence.json'. Include --evidence to persist the full audit-evidence artifact; without it, this run produces pass/fail output only."
    required: true
  working-directory:
    description: "Directory to run env-cap from."
    required: false
    default: "."
  version:
    description: "env-cap version to use via npx if not already a local devDependency."
    required: false
    default: ""
  comment:
    description: "Upsert a sticky PR summary comment."
    required: false
    default: "true"
  report-key:
    description: "Identifies this invocation's sticky comment, so multiple calls against the same PR (e.g. one per package in a monorepo) don't overwrite each other. Empty defaults to working-directory (resolved in report.mjs, not here -- action.yml input defaults can't reliably reference another input)."
    required: false
    default: ""
  annotations:
    description: "Emit inline ::warning/::error PR annotations."
    required: false
    default: "true"
  rotation-alert:
    description: "When no PR is available to comment on (e.g. a scheduled run), open/update a GitHub issue -- and auto-close it once resolved -- for any expiring/expired variable found. Requires `issues: write` in the calling workflow's permissions."
    required: false
    default: "true"
  github-token:
    description: "Token used for `gh` PR-comment calls."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        # "env-cap" alone (no npm scope) does not exist on the public npm
        # registry -- only the published "@maverickcer/env-cap" does (the
        # unscoped name is only the *binary* name, from package.json's
        # `bin` field, resolvable via `npx` without a scope ONLY when
        # something already installed it locally, e.g. a consumer's own
        # devDependency). Confirmed by hand: `npx --yes env-cap@<version>`
        # 404s directly against the real registry. `--yes` here means "fetch
        # it via npx if not already local" (this input's own description),
        # so it must reference the real, scoped package name.
        PKG="@maverickcer/env-cap"
        if [ -n "${{ inputs.version }}" ]; then PKG="@maverickcer/env-cap@${{ inputs.version }}"; fi
        npx --yes "$PKG" --json ${{ inputs.args }} > "$RUNNER_TEMP/env-cap-result.json"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
        set -e
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT_PATH: ${{ runner.temp }}/env-cap-result.json
        DO_COMMENT: ${{ inputs.comment }}
        DO_ANNOTATIONS: ${{ inputs.annotations }}
        DO_ROTATION_ALERT: ${{ inputs.rotation-alert }}
        REPORT_KEY: ${{ inputs.report-key }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: node "${{ github.action_path }}/scripts/github-action/report.mjs"
    - shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}
