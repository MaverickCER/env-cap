name: "env-cap report"
description: "Runs env-cap (your installed copy, or the version you name), fails on its exit code, and reports findings as PR annotations and one summary comment."
inputs:
  args:
    description: "Arguments passed to `env-cap --json`, for example '--location src/generated/env.manifest.ts --evidence docs/env.evidence.json --strict-docs'. Annotations, the summary comment and rotation-alert issues read the evidence file, so pass --evidence to get them. Without it, the run reports only the manifest pass or fail. The value is split into words, so it can add CLI flags."
    required: true
  working-directory:
    description: "Directory to run env-cap from."
    required: false
    default: "."
  version:
    description: "env-cap version to run through npx when the project does not install env-cap. Required in that case: without it the Action exits 2. It accepts a version or a dist-tag, so `latest` runs the newest release; pin a version instead. Ignored when env-cap is installed."
    required: false
    default: ""
  comment:
    description: "Create or update one sticky summary comment on the PR."
    required: false
    default: "true"
  report-key:
    description: "Identifies this invocation's sticky comment, so several calls on one PR (for example one per package in a monorepo) do not overwrite each other. Empty means working-directory."
    required: false
    default: ""
  annotations:
    description: "Emit inline ::warning and ::error annotations for findings."
    required: false
    default: "true"
  rotation-alert:
    description: "On a run with no PR, such as a scheduled run, open or update an issue listing expiring variables. Close it when none remain. Needs --evidence and `issues: write`. Only the open-or-close decision is unit-tested."
    required: false
    default: "true"
  github-token:
    description: "Token for the gh calls that post the PR comment and the rotation-alert issue."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_VERSION: ${{ inputs.version }}
        RESULT_PATH: ${{ runner.temp }}/env-cap-result.json
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/github-action/run-cli.sh"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT_PATH: ${{ runner.temp }}/env-cap-result.json
        DO_COMMENT: ${{ inputs.comment }}
        DO_ANNOTATIONS: ${{ inputs.annotations }}
        DO_ROTATION_ALERT: ${{ inputs.rotation-alert }}
        REPORT_KEY: ${{ inputs.report-key }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/github-action/report.mjs"
    - shell: bash
      env:
        CLI_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CLI_EXIT_CODE"
