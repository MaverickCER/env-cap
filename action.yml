name: "env-cap report"
description: "Runs env-cap and turns the result into PR annotations and a summary comment."
inputs:
  args:
    description: "Arguments passed to `env-cap --json`, e.g. '--location src/generated/env.manifest.ts --strict-docs --evidence docs/env.evidence.json'. Include --evidence to get full documentation/ownership/expiring-secret reporting (PR annotations, the summary comment, and rotation-alert issues all read the persisted evidence artifact's Finding/Lifecycle Model, ADR 0038) -- without it, this run produces manifest-only pass/fail output. --docs/--ownership are no longer CLI flags at all (ADR 0046); this Action's own reporting no longer depends on them."
    required: true
  working-directory:
    description: "Directory to run env-cap from."
    required: false
    default: "."
  version:
    description: "env-cap version to fetch via npx when it is not a local devDependency. Required in that case: the action fails rather than run an unpinned `latest`. Ignored when the project has env-cap installed."
    required: false
    default: ""
  comment:
    description: "Upsert a sticky PR summary comment."
    required: false
    default: "true"
  report-key:
    description: "Identifies this invocation's sticky comment, so multiple calls against the same PR (e.g. one per package in a monorepo) don't overwrite each other. Empty defaults to working-directory (resolved in report.mjs, not here -- action.yml input defaults can't reliably reference another input)."
    required: false
    default: ""
  annotations:
    description: "Emit inline ::warning/::error PR annotations."
    required: false
    default: "true"
  rotation-alert:
    description: "When no PR is available to comment on (e.g. a scheduled run), open/update a GitHub issue -- and auto-close it once resolved -- for any expiring/expired variable found. Requires `issues: write` in the calling workflow's permissions."
    required: false
    default: "true"
  github-token:
    description: "Token used for `gh` PR-comment calls."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_VERSION: ${{ inputs.version }}
        RESULT_PATH: ${{ runner.temp }}/env-cap-result.json
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/scripts/github-action/run-cli.sh"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT_PATH: ${{ runner.temp }}/env-cap-result.json
        DO_COMMENT: ${{ inputs.comment }}
        DO_ANNOTATIONS: ${{ inputs.annotations }}
        DO_ROTATION_ALERT: ${{ inputs.rotation-alert }}
        REPORT_KEY: ${{ inputs.report-key }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/scripts/github-action/report.mjs"
    - shell: bash
      env:
        CLI_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CLI_EXIT_CODE"
